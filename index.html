<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/imagee.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <!-- Same dark as the tab bar: Android paints the system bars (status bar, the strip with the
         home gesture pill) in this colour, so they blend into the app instead of showing grey -->
    <meta name="theme-color" content="#0a0706" />

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FtF" />

    <title>Fuge trifft Fuge — Internes Arbeitssystem</title>
    <meta name="description" content="Fuge trifft Fuge — internes Arbeitssystem für Fugenarbeiten. Projektverwaltung, Arbeitsstunden und Mitarbeiterkoordination." />
    <meta name="keywords" content="Fuge trifft Fuge, Fugenarbeiten, Fliesenleger, Arbeitssystem, CRM" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Fuge trifft Fuge" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Fuge trifft Fuge — Internes Arbeitssystem" />
    <meta property="og:description" content="Internes Arbeitssystem für Projektverwaltung, Arbeitsstunden und Mitarbeiterkoordination." />
    <meta property="og:image" content="/imagee.png" />
    <meta property="og:locale" content="de_DE" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Critical: set bg before any JS/CSS — prevents white flash on mobile -->
    <style>
      html,body{background:#0d0d0d;margin:0;padding:0}
      #root{min-height:100vh}
      @keyframes sk{0%{background-position:-400px 0}100%{background-position:400px 0}}
      .sk{background:linear-gradient(90deg,#161616 25%,#1e1e1e 50%,#161616 75%);background-size:800px 100%;animation:sk 1.4s infinite linear;border-radius:6px}
      #sk{min-height:100vh;background:#0d0d0d;display:flex;flex-direction:column}
      #sk-nav{height:58px;background:rgba(10,10,10,0.88);border-bottom:1px solid #252525;align-items:center;padding:0 24px;gap:16px;display:none}
      #sk-content{flex:1;padding:20px 16px calc(62px + env(safe-area-inset-bottom) + 16px)}
      .sk-card{background:#141414;border:1px solid #1e1e1e;border-radius:8px;padding:16px;margin-bottom:12px}
      .sk-row{display:flex;align-items:center;gap:12px;margin-bottom:10px}
      .sk-circ{width:36px;height:36px;border-radius:50%;flex-shrink:0}
      .sk-lines{flex:1}
      .sk-l1{height:13px;margin-bottom:7px;width:55%}
      .sk-l2{height:10px;width:38%}
      .sk-lw{height:10px;width:75%;margin-top:4px}
      #sk-tabs{position:fixed;bottom:0;left:0;right:0;height:62px;background:rgba(10,10,10,0.92);border-top:1px solid #252525;align-items:center;padding-bottom:env(safe-area-inset-bottom);z-index:200;display:none}
      .sk-tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
      .sk-ti{width:22px;height:22px;border-radius:4px}
      .sk-tl{width:28px;height:6px;border-radius:3px}
      @media(max-width:768px){#sk-tabs{display:flex}#sk-content{padding-bottom:calc(62px + env(safe-area-inset-bottom) + 16px)}}
      @media(min-width:769px){#sk-nav{display:flex}#sk-content{padding:28px 32px;max-width:960px;margin:0 auto;width:100%}}
      /* Boot watchdog (shown only when the app did not start) */
      #boot-fail{position:fixed;left:16px;right:16px;bottom:calc(62px + env(safe-area-inset-bottom) + 12px);z-index:9999;max-width:420px;margin:0 auto;padding:16px;background:#161616;border:1px solid #363636;border-radius:10px;font:14px/1.45 Inter,system-ui,sans-serif;color:#fff;box-shadow:0 8px 32px rgba(0,0,0,0.6)}
      #boot-fail p{margin:0 0 6px}
      #boot-fail .bf-sub{color:#8a8a8a;font-size:13px}
      #boot-fail .bf-err{color:#cc2222;font-size:12px;word-break:break-word;margin-top:8px}
      #boot-fail .bf-btns{display:flex;gap:8px;margin-top:12px}
      #boot-fail button{flex:1;min-height:44px;border-radius:8px;border:1px solid #363636;background:transparent;color:#fff;font:600 13px Inter,system-ui,sans-serif;cursor:pointer}
      #boot-fail button.bf-main{background:#cc2222;border-color:#cc2222}
      @media(min-width:769px){#boot-fail{bottom:32px}}
    </style>
    <!-- Boot watchdog: if the app has not replaced the skeleton after 15 s, offer a way out.
         No automatic reloads (a slow connection must not end in a reload loop). -->
    <script>
      (function () {
        var lastError = '';
        function remember(msg) { if (!lastError && msg) lastError = String(msg).slice(0, 200); }
        // capture = true also catches a <script> / <link> that failed to load
        window.addEventListener('error', function (e) {
          var t = e.target;
          if (t && t !== window && t.tagName) {
            // only app code matters here (a missing web font is normal offline)
            if (t.tagName === 'SCRIPT' || (t.tagName === 'LINK' && /modulepreload/.test(t.rel))) {
              remember('Datei nicht geladen: ' + (t.src || t.href || '').split('/').pop());
            }
          } else remember(e.message);
        }, true);
        window.addEventListener('unhandledrejection', function (e) {
          remember(e.reason && e.reason.message ? e.reason.message : e.reason);
        });

        function clearCachesAndReload() {
          var tasks = [];
          if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
            tasks.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
              return Promise.all(regs.map(function (r) { return r.unregister(); }));
            }));
          }
          if (window.caches && caches.keys) {
            tasks.push(caches.keys().then(function (keys) {
              return Promise.all(keys.map(function (k) { return caches.delete(k); }));
            }));
          }
          // The login stays (localStorage / IndexedDB are not touched)
          Promise.all(tasks).catch(function () {}).then(function () { location.reload(); });
        }

        function el(tag, cls, text) {
          var n = document.createElement(tag);
          if (cls) n.className = cls;
          if (text) n.textContent = text;
          return n;
        }

        function showBox() {
          if (document.getElementById('boot-fail')) return;
          var box = el('div');
          box.id = 'boot-fail';
          box.setAttribute('role', 'alert');
          box.appendChild(el('p', '', 'Die App lädt länger als gewöhnlich.'));
          box.appendChild(el('p', 'bf-sub', 'Prüfe deine Internetverbindung. Wenn es so bleibt, tippe auf „Neu laden“ oder „Cache leeren“ (du bleibst angemeldet).'));
          if (lastError) box.appendChild(el('p', 'bf-err', 'Fehler: ' + lastError));
          var btns = el('div', 'bf-btns');
          var reload = el('button', 'bf-main', 'Neu laden');
          reload.type = 'button';
          reload.onclick = function () { location.reload(); };
          var clear = el('button', '', 'Cache leeren');
          clear.type = 'button';
          clear.onclick = function () { clear.disabled = true; clear.textContent = '…'; clearCachesAndReload(); };
          btns.appendChild(reload);
          btns.appendChild(clear);
          box.appendChild(btns);
          document.body.appendChild(box);
          // the app may still finish loading (slow network): then the box disappears again
          var timer = setInterval(function () {
            if (!document.getElementById('sk')) { box.remove(); clearInterval(timer); }
          }, 500);
        }

        setTimeout(function () {
          if (document.getElementById('sk')) showBox();
        }, 15000);
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Skeleton — replaced immediately when React mounts -->
      <div id="sk">
        <div id="sk-nav">
          <div class="sk" style="width:80px;height:16px"></div>
          <div style="flex:1"></div>
          <div class="sk sk-circ" style="width:32px;height:32px"></div>
        </div>
        <div id="sk-content">
          <div class="sk" style="height:26px;width:140px;margin-bottom:20px"></div>
          <div class="sk-card">
            <div class="sk-row">
              <div class="sk sk-circ"></div>
              <div class="sk-lines"><div class="sk sk-l1"></div><div class="sk sk-l2"></div></div>
            </div>
            <div class="sk sk-lw"></div>
          </div>
          <div class="sk-card">
            <div class="sk-row">
              <div class="sk sk-circ"></div>
              <div class="sk-lines"><div class="sk sk-l1"></div><div class="sk sk-l2"></div></div>
            </div>
            <div class="sk sk-lw"></div>
          </div>
          <div class="sk-card">
            <div class="sk-row">
              <div class="sk sk-circ"></div>
              <div class="sk-lines"><div class="sk sk-l1"></div><div class="sk sk-l2"></div></div>
            </div>
          </div>
        </div>
        <div id="sk-tabs">
          <div class="sk-tab"><div class="sk sk-ti"></div><div class="sk sk-tl"></div></div>
          <div class="sk-tab"><div class="sk sk-ti"></div><div class="sk sk-tl"></div></div>
          <div class="sk-tab"><div class="sk sk-ti"></div><div class="sk sk-tl"></div></div>
          <div class="sk-tab"><div class="sk sk-ti"></div><div class="sk sk-tl"></div></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
